<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard</title>
    <style>
        body {
            /* Transparent so OBS composites the bar over the table feed. */
            background-color: transparent;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
        }

        /* Broadcast-style lower-third bar, sized for a 1920x1080 browser
           source: dark-blue gradient, silver border, bottom-center. */
        .scoreboard-container {
            display: flex;
            background: linear-gradient(to right, #1a1a7a, #0d0d52);
            color: white;
            border: 2px solid #a8a8a8;
            border-radius: 4px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
            width: 1400px;
            height: 45px;
            margin-bottom: 50px;
            overflow: hidden;
            align-items: center;
        }

        /* Nothing renders until the first WS payload arrives. */
        .scoreboard-container.waiting { display: none; }

        .player-side {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-size: 24px;
            font-weight: bold;
            height: 100%;
        }

        .player-side.left {
            justify-content: space-between;
        }

        .player-side.right {
            justify-content: space-between;
            flex-direction: row-reverse;
        }

        .player-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score-box {
            background-color: #1a1a7a;
            padding: 0 20px;
            font-size: 28px;
            height: 100%;
            display: flex;
            align-items: center;
            border-left: 1px solid rgba(255,255,255,0.2);
            border-right: 1px solid rgba(255,255,255,0.2);
            font-variant-numeric: tabular-nums;
        }

        /* Brief glow when a score changes — restrained, one-shot. */
        .score-box.pulse {
            animation: score-pulse 0.9s ease-out;
        }
        @keyframes score-pulse {
            0%   { background-color: #3a3ab8; box-shadow: 0 0 14px rgba(140,160,255,0.7); }
            100% { background-color: #1a1a7a; box-shadow: none; }
        }

        .center-info {
            background-color: #000;
            color: #ccc;
            padding: 0 30px;
            height: 100%;
            display: flex;
            align-items: center;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* Hidden entirely when race_to is null (casual play, no target). */
        .center-info.no-race { display: none; }
    </style>
</head>
<body>

    <div class="scoreboard-container waiting" id="board">
        <div class="player-side left">
            <div class="player-name" id="p1-name"></div>
            <div class="score-box" id="p1-score"></div>
        </div>

        <div class="center-info" id="race"></div>

        <div class="player-side right">
            <div class="player-name" id="p2-name"></div>
            <div class="score-box" id="p2-score"></div>
        </div>
    </div>

    <script>
        const board = document.getElementById('board');
        const raceEl = document.getElementById('race');
        // Last shown score per player, to pulse only on change (not first paint).
        const shown = { p1: null, p2: null };

        function setScore(key, value) {
            const el = document.getElementById(key + '-score');
            el.innerText = value;
            if (shown[key] !== null && shown[key] !== value) {
                // Restart the one-shot animation even for rapid +/- taps.
                el.classList.remove('pulse');
                void el.offsetWidth; // force reflow so re-adding replays it
                el.classList.add('pulse');
            }
            shown[key] = value;
        }

        function render(payload) {
            const s = payload.score;
            if (!s) return; // stay blank until a payload carrying score arrives
            board.classList.remove('waiting');
            document.getElementById('p1-name').innerText = s.p1.name;
            document.getElementById('p2-name').innerText = s.p2.name;
            setScore('p1', s.p1.score);
            setScore('p2', s.p2.score);
            if (s.race_to == null) {
                raceEl.classList.add('no-race');
            } else {
                raceEl.classList.remove('no-race');
                raceEl.innerText = 'RACE TO ' + s.race_to;
            }
        }

        function connect() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${proto}://${location.host}/ws`);
            ws.onmessage = (ev) => {
                try { render(JSON.parse(ev.data)); } catch (e) {}
            };
            ws.onclose = () => setTimeout(connect, 500);
            ws.onerror = () => ws.close();
        }
        connect();
    </script>
</body>
</html>
