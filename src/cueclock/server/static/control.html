<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shot Clock Control</title>
    <style>
        :root { color-scheme: dark; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #111;
            color: #eee;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        .readout {
            background: #000;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 18px 28px;
            min-width: 280px;
            text-align: center;
        }
        .time { font-size: 72px; font-weight: bold; font-variant-numeric: tabular-nums; }
        .state { color: #8cf; letter-spacing: 2px; }
        .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        button {
            background: #1e1e1e;
            color: #eee;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 14px 22px;
            font-size: 18px;
            cursor: pointer;
            min-width: 140px;
        }
        button:hover { background: #2a2a2a; }
        button.primary { background: #2b6cb0; border-color: #2b6cb0; }
        button.warn { background: #a05a00; border-color: #a05a00; }
        button.danger { background: #8b2e2e; border-color: #8b2e2e; }
        select, input {
            background: #1e1e1e; color: #eee; border: 1px solid #555;
            border-radius: 8px; padding: 10px 14px; font-size: 16px;
        }
        label { font-size: 14px; color: #aaa; }
        h3 { margin: 12px 0 0; color: #aaa; font-weight: normal; letter-spacing: 2px; }
        /* Vision kill switch — its state must be readable at a glance. */
        button.vision-on  { background: #276749; border-color: #38a169; }
        button.vision-off { background: #8b2e2e; border-color: #e05050; }
        .player-col {
            display: flex; flex-direction: column; gap: 8px; align-items: center;
        }
        .player-col input { width: 140px; text-align: center; }
        .score-line { display: flex; gap: 8px; align-items: center; }
        .score-line button { min-width: 56px; font-size: 24px; padding: 8px 0; }
        .score-val {
            font-size: 36px; font-weight: bold; min-width: 56px; text-align: center;
            font-variant-numeric: tabular-nums;
        }
        #race-to { width: 70px; text-align: center; }
    </style>
</head>
<body>
    <h2>Shot Clock</h2>
    <div class="readout">
        <div class="time" id="time">–</div>
        <div class="state" id="state">—</div>
        <div id="extensions" style="color:#888;margin-top:4px;"></div>
    </div>

    <div class="row">
        <button class="primary" onclick="post('/api/start')">Start</button>
        <button onclick="post('/api/pause')">Pause</button>
        <button class="danger" onclick="post('/api/reset')">Reset</button>
    </div>
    <div class="row">
        <!-- Same vocabulary as the deck (hardware.md §C2), so the fallback
             surface and the buttons under your hand can't disagree.
             Set up: you're racking or throwing balls back up — clock parks,
             extensions refill, shot count zeroes. Push: 9-ball push-out call.
             Start N: the clock is wrong and you're about to shoot — fresh
             countdown running now, labelled with the time it will hand you. -->
        <button class="primary" onclick="post('/api/rack')">Set up</button>
        <button onclick="post('/api/push')">Push</button>
        <button id="start-n" onclick="post('/api/restart')">Start</button>
    </div>
    <div class="row">
        <button class="warn" onclick="post('/api/extension')">Extension</button>
    </div>

    <div class="row" style="align-items:center;">
        <label for="ruleset">Ruleset:</label>
        <select id="ruleset" onchange="setRuleset(this.value)"></select>
    </div>

    <div class="row" style="align-items:center;">
        <!-- Session mode — orthogonal to the ruleset (docs/design.md §2.1).
             match: rack rules + the break gate. run_out: no rack, so no
             first-shot allowance and any-speed opener. no_clock: vision keeps
             journaling but never drives the clock. Mirrored here because the
             deck's Mode key is otherwise the only way out of no_clock. -->
        <label for="mode">Mode:</label>
        <select id="mode" onchange="setMode(this.value)"></select>
    </div>

    <div class="row">
        <!-- Match-day kill switch: when OFF the server ignores vision
             shot/settle events and the clock runs manually (deck/voice). -->
        <button id="vision" onclick="toggleVision()">VISION —</button>
    </div>

    <h3>MATCH SCORE</h3>
    <div class="row">
        <div class="player-col">
            <input id="p1-name" placeholder="Player 1" onchange="postConfig()">
            <div class="score-line">
                <button onclick="post('/api/score/p1/decrement')">&minus;</button>
                <span class="score-val" id="p1-score">–</span>
                <button onclick="post('/api/score/p1/increment')">+</button>
            </div>
        </div>
        <div class="player-col">
            <input id="p2-name" placeholder="Player 2" onchange="postConfig()">
            <div class="score-line">
                <button onclick="post('/api/score/p2/decrement')">&minus;</button>
                <span class="score-val" id="p2-score">–</span>
                <button onclick="post('/api/score/p2/increment')">+</button>
            </div>
        </div>
    </div>
    <div class="row" style="align-items:center;">
        <label for="race-to">Race to:</label>
        <input type="number" id="race-to" min="1" placeholder="—" onchange="postConfig()">
        <button class="danger" onclick="resetScores()">Reset scores</button>
    </div>

    <script>
        async function post(url) {
            await fetch(url, { method: 'POST' });
        }
        async function setRuleset(name) {
            await fetch('/api/ruleset/' + encodeURIComponent(name), { method: 'POST' });
        }
        async function setMode(name) {
            await fetch('/api/mode/' + encodeURIComponent(name), { method: 'POST' });
        }
        function fillSelect(id, listing) {
            const sel = document.getElementById(id);
            sel.innerHTML = '';
            for (const n of listing.available) {
                const opt = document.createElement('option');
                opt.value = n; opt.textContent = n;
                if (n === listing.active) opt.selected = true;
                sel.appendChild(opt);
            }
        }
        async function loadRulesets() {
            fillSelect('ruleset', await fetch('/api/rulesets').then(x => x.json()));
            fillSelect('mode', await fetch('/api/modes').then(x => x.json()));
        }

        // ---- Vision kill switch ----
        let visionOn = null; // unknown until the first payload
        function renderVision(on) {
            visionOn = on;
            const b = document.getElementById('vision');
            b.innerText = on ? 'VISION ON' : 'VISION OFF';
            b.classList.toggle('vision-on', on);
            b.classList.toggle('vision-off', !on);
        }
        async function toggleVision() {
            if (visionOn === null) return; // no payload yet — state unknown
            await post(visionOn ? '/api/vision/off' : '/api/vision/on');
        }

        // ---- Match score ----
        function syncInput(id, value) {
            // Don't clobber a field the operator is currently editing.
            const el = document.getElementById(id);
            if (document.activeElement !== el) el.value = value;
        }
        function renderScore(sc) {
            document.getElementById('p1-score').innerText = sc.p1.score;
            document.getElementById('p2-score').innerText = sc.p2.score;
            syncInput('p1-name', sc.p1.name);
            syncInput('p2-name', sc.p2.name);
            syncInput('race-to', sc.race_to ?? '');
        }
        async function postConfig() {
            const race = document.getElementById('race-to').value.trim();
            await fetch('/api/score/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    p1_name: document.getElementById('p1-name').value,
                    p2_name: document.getElementById('p2-name').value,
                    race_to: race === '' ? null : parseInt(race, 10),
                }),
            });
        }
        async function resetScores() {
            if (confirm('Reset scores to 0–0?')) await post('/api/score/reset');
        }

        function render(s) {
            document.getElementById('time').innerText = s.display ?? s.time ?? '–';
            document.getElementById('state').innerText = s.state;
            document.getElementById('extensions').innerText =
                `extensions: ${s.extensions_used}/${s.extensions_allowed}`;
            // Same trick as the deck's START key: name the countdown the press
            // will hand you, straight off the server's rack-aware `base`.
            if (typeof s.base === 'number') {
                document.getElementById('start-n').innerText = `Start ${s.base}`;
            }
            // re-sync the dropdowns if either axis changed elsewhere (the deck)
            for (const [id, active] of [['ruleset', s.ruleset], ['mode', s.mode]]) {
                const sel = document.getElementById(id);
                if (active && sel.value !== active) {
                    for (const o of sel.options) if (o.value === active) o.selected = true;
                }
            }
            if (typeof s.vision === 'boolean') renderVision(s.vision);
            if (s.score) renderScore(s.score);
        }
        function connect() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${proto}://${location.host}/ws`);
            ws.onmessage = (ev) => { try { render(JSON.parse(ev.data)); } catch(e) {} };
            ws.onclose = () => setTimeout(connect, 500);
        }
        loadRulesets();
        connect();
    </script>
</body>
</html>
