<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shot Clock Control</title>
    <style>
        /* The phone surface. Same palette as the wall overlay (issue #23), so
           the thing in your hand and the thing on the TV read as one product.
           Nothing here is new capability — every control below already existed
           on this page or on the deck; what changed is that you can find them. */
        :root {
            color-scheme: dark;
            --ink: #0B0E13;
            --panel: #12161E;
            --field: #080B10;
            --line: rgba(255,255,255,.09);
            --line-strong: rgba(255,255,255,.16);
            --slate: #9FB3C4;
            --accent: #2E86C8;
            --alarm: #FF4D4D;
            --text: #EDF1F5;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px 16px 64px;
            background: var(--ink);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

        header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
        h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: .2px; }
        .conn {
            font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase;
            color: var(--slate); display: flex; align-items: center; gap: 7px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--alarm); }
        .conn.live .dot { background: var(--accent); }

        section {
            background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
            padding: 16px; display: flex; flex-direction: column; gap: 14px;
        }
        h2 {
            font-size: 11.5px; font-weight: 700; letter-spacing: 1.8px;
            text-transform: uppercase; color: var(--slate); margin: 0;
        }

        /* The clock readout wears the same face as the wall, so the two can
           never disagree about what the clock is doing. */
        .readout { display: flex; align-items: center; gap: 18px; }
        .readout .num {
            font-size: 68px; font-weight: 700; line-height: .9;
            font-variant-numeric: tabular-nums;
        }
        .readout .num.urgent { color: var(--alarm); }
        .readout .meta { display: flex; flex-direction: column; gap: 4px; }
        .pill {
            align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: 1.6px;
            text-transform: uppercase; padding: 4px 10px; border-radius: 999px;
            border: 1px solid var(--line-strong); color: var(--slate);
        }
        .pill.live { color: var(--accent); border-color: rgba(46,134,200,.45); }
        .pill.alarm { color: var(--alarm); border-color: rgba(255,77,77,.45); }
        .sub { font-size: 13px; color: var(--slate); }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 9px; }
        button {
            background: #1A1F29; color: var(--text); border: 1px solid var(--line-strong);
            border-radius: 9px; padding: 13px 10px; font-size: 15px; font-weight: 600;
            cursor: pointer; font-family: inherit; transition: background .12s, border-color .12s;
        }
        button:hover { background: #222836; }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        button.primary { background: var(--accent); border-color: var(--accent); color: #04121F; }
        button.primary:hover { background: #3D97DA; }
        button.ghost { background: transparent; }
        /* Destructive controls are outlined, never filled: a red slab beside
           Start is a thing you hit by accident at the table. */
        button.danger { color: var(--alarm); border-color: rgba(255,77,77,.4); background: transparent; }
        button.danger:hover { background: rgba(255,77,77,.1); }

        .players { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .player { display: flex; flex-direction: column; gap: 9px; }
        label {
            font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
            text-transform: uppercase; color: var(--slate);
        }
        input[type="text"] {
            background: var(--field); color: var(--text); border: 1px solid var(--line-strong);
            border-radius: 9px; padding: 12px 13px; font-size: 16px; font-family: inherit; width: 100%;
        }
        input[type="text"]:focus { outline: none; border-color: var(--accent); }
        input::placeholder { color: #55606C; }

        /* ---- Fargo lookup (issue #27) ---- */
        .fargo-badge { color: var(--accent); margin-left: 6px; }
        .namerow { display: flex; gap: 8px; }
        .namerow input { flex: 1; min-width: 0; }
        .namerow .fargo-go {
            padding: 0 14px; font-size: 12px; font-weight: 700;
            letter-spacing: 1.2px; text-transform: uppercase; color: var(--slate);
        }
        .fargo-results { display: flex; flex-direction: column; gap: 6px; max-height: 244px; overflow-y: auto; }
        .fargo-results button {
            display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
            padding: 10px 12px; font-size: 14px; font-weight: 500; text-align: left;
        }
        .fargo-results .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fargo-results .who .loc { color: var(--slate); }
        .fargo-results .rating {
            font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap;
        }
        .fargo-results .rating .prov { color: var(--slate); font-weight: 500; font-size: 12px; }
        .fargo-results .note { color: var(--slate); font-size: 13px; }

        .stepper { display: flex; align-items: stretch; gap: 8px; }
        .stepper button { min-width: 52px; font-size: 21px; padding: 8px 0; }
        .stepper .val {
            flex: 1; display: flex; align-items: center; justify-content: center;
            background: var(--field); border: 1px solid var(--line); border-radius: 9px;
            font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;
        }
        .race { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .race .stepper { flex: 1; min-width: 210px; }
        .race .stepper .val { font-size: 24px; }
        .hint { font-size: 12.5px; color: var(--slate); margin: 0; }

        .field { display: flex; flex-direction: column; gap: 7px; }
        select {
            background: var(--field); color: var(--text); border: 1px solid var(--line-strong);
            border-radius: 9px; padding: 12px 13px; font-size: 16px; font-family: inherit; width: 100%;
        }
        .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .vision {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            border-top: 1px solid var(--line); padding-top: 14px;
        }
        .vision .txt { display: flex; flex-direction: column; gap: 3px; }
        .vision .txt b { font-size: 14px; font-weight: 650; }
        .vision button { min-width: 76px; }
        button.on { background: rgba(46,134,200,.16); border-color: rgba(46,134,200,.5); color: var(--accent); }
        button.off { background: rgba(255,77,77,.14); border-color: rgba(255,77,77,.5); color: var(--alarm); }

        .danger-row { display: flex; justify-content: flex-end; }

        @media (max-width: 460px) {
            .players, .two { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="wrap">

    <header>
        <h1>cueclock</h1>
        <div class="conn" id="conn"><span class="dot"></span><span id="conn-text">Connecting</span></div>
    </header>

    <!-- Match first: it is what this page gets opened on a phone to do, and
         until now it was the last thing on a long scroll under the vision
         kill switch. -->
    <section>
        <h2>Match</h2>
        <div class="players">
            <div class="player">
                <label for="p1-name">Player 1<span class="fargo-badge" id="p1-fargo-badge" hidden></span></label>
                <!-- The button exists because onchange alone is undiscoverable
                     and never fires for a name that is already right (a
                     persisted name retyped identically is not a change). -->
                <div class="namerow">
                    <input type="text" id="p1-name" placeholder="Player 1" onchange="nameChanged('p1')">
                    <button class="fargo-go" onclick="fargoSearch('p1')">Fargo</button>
                </div>
                <div class="fargo-results" id="p1-fargo-results" hidden></div>
                <div class="stepper">
                    <button aria-label="Player 1 minus one" onclick="post('/api/score/p1/decrement')">&minus;</button>
                    <div class="val" id="p1-score">–</div>
                    <button aria-label="Player 1 plus one" onclick="post('/api/score/p1/increment')">+</button>
                </div>
            </div>
            <div class="player">
                <label for="p2-name">Player 2<span class="fargo-badge" id="p2-fargo-badge" hidden></span></label>
                <div class="namerow">
                    <input type="text" id="p2-name" placeholder="Player 2" onchange="nameChanged('p2')">
                    <button class="fargo-go" onclick="fargoSearch('p2')">Fargo</button>
                </div>
                <div class="fargo-results" id="p2-fargo-results" hidden></div>
                <div class="stepper">
                    <button aria-label="Player 2 minus one" onclick="post('/api/score/p2/decrement')">&minus;</button>
                    <div class="val" id="p2-score">–</div>
                    <button aria-label="Player 2 plus one" onclick="post('/api/score/p2/increment')">+</button>
                </div>
            </div>
        </div>

        <!-- A stepper, not <input type="number">: on a phone that control is
             either two tiny arrows or a whole numeric keyboard, for a value
             that is almost always 5, 7 or 9. -->
        <div class="race">
            <label for="race-to" style="min-width:64px">Race to</label>
            <div class="stepper">
                <button aria-label="Race to, one fewer" onclick="stepRace(-1)">&minus;</button>
                <div class="val" id="race-to">–</div>
                <button aria-label="Race to, one more" onclick="stepRace(1)">+</button>
            </div>
            <button class="ghost" onclick="clearRace()">Clear</button>
        </div>
        <p class="hint">Cleared means casual &mdash; the wall hides the race line entirely.</p>

        <div class="danger-row"><button class="danger" onclick="resetScores()">Reset scores</button></div>
    </section>

    <!-- Clock: the same vocabulary as the deck (hardware.md §C2), because this
         is the deck's fallback surface and the two must not disagree.
         New Rack: you're racking or throwing balls back up — clock parks,
         extensions refill, shot count zeroes. Push: 9-ball push-out call.
         Start N: the clock is wrong and you're about to shoot — fresh
         countdown running now, labelled with the time it will hand you. -->
    <section>
        <h2>Clock</h2>
        <div class="readout">
            <div class="num" id="time">–</div>
            <div class="meta">
                <span class="pill" id="state">—</span>
                <span class="sub" id="extensions"></span>
            </div>
        </div>
        <div class="grid">
            <button class="primary" id="start-n" onclick="post('/api/restart')">Start</button>
            <button onclick="post('/api/rack')">New Rack</button>
            <button onclick="post('/api/push')">Push</button>
            <button onclick="post('/api/extension')">Extension</button>
            <button onclick="post('/api/pause')">Pause</button>
        </div>
        <div class="danger-row"><button class="danger" onclick="post('/api/reset')">Reset clock</button></div>
    </section>

    <section>
        <h2>Session</h2>
        <div class="two">
            <div class="field">
                <label for="ruleset">Ruleset</label>
                <select id="ruleset" onchange="setRuleset(this.value)"></select>
            </div>
            <div class="field">
                <!-- Session mode — orthogonal to the ruleset (design.md §2.1).
                     match: rack rules + the break gate. run_out: no rack, so no
                     first-shot allowance. no_clock: vision keeps journaling but
                     never drives the clock. Mirrored here because the deck's
                     Mode key is otherwise the only way out of no_clock. -->
                <label for="mode">Mode</label>
                <select id="mode" onchange="setMode(this.value)"></select>
            </div>
        </div>
        <div class="vision">
            <div class="txt">
                <b>Vision</b>
                <span class="hint">Off means shots and settles stop moving the clock.</span>
            </div>
            <button id="vision" onclick="toggleVision()">—</button>
        </div>
    </section>

</div>

<script>
    async function post(url) {
        await fetch(url, { method: 'POST' });
    }
    async function setRuleset(name) {
        await fetch('/api/ruleset/' + encodeURIComponent(name), { method: 'POST' });
    }
    async function setMode(name) {
        await fetch('/api/mode/' + encodeURIComponent(name), { method: 'POST' });
    }
    function fillSelect(id, listing) {
        const sel = document.getElementById(id);
        sel.innerHTML = '';
        for (const n of listing.available) {
            const opt = document.createElement('option');
            opt.value = n; opt.textContent = n;
            if (n === listing.active) opt.selected = true;
            sel.appendChild(opt);
        }
    }
    async function loadRulesets() {
        fillSelect('ruleset', await fetch('/api/rulesets').then(x => x.json()));
        fillSelect('mode', await fetch('/api/modes').then(x => x.json()));
    }

    // ---- Vision kill switch ----
    let visionOn = null; // unknown until the first payload
    function renderVision(on) {
        visionOn = on;
        const b = document.getElementById('vision');
        b.innerText = on ? 'On' : 'Off';
        b.classList.toggle('on', on);
        b.classList.toggle('off', !on);
    }
    async function toggleVision() {
        if (visionOn === null) return; // no payload yet — state unknown
        await post(visionOn ? '/api/vision/off' : '/api/vision/on');
    }

    // ---- Match ----
    let raceTo = null; // mirrors the server; null = casual, no target

    function syncInput(id, value) {
        // Don't clobber a field the operator is currently editing.
        const el = document.getElementById(id);
        if (document.activeElement !== el) el.value = value;
    }
    function renderScore(sc) {
        document.getElementById('p1-score').innerText = sc.p1.score;
        document.getElementById('p2-score').innerText = sc.p2.score;
        syncInput('p1-name', sc.p1.name);
        syncInput('p2-name', sc.p2.name);
        renderFargoBadge('p1', sc.p1.fargo);
        renderFargoBadge('p2', sc.p2.fargo);
        raceTo = sc.race_to;
        document.getElementById('race-to').innerText = raceTo == null ? '–' : raceTo;
    }

    // ---- Fargo lookup (issue #27) ----
    // Entering a name searches FargoRate (via the server proxy — the
    // dashboard sends no CORS headers) and offers the matches under the
    // input. Picking one attaches the rating; the pick is always a human
    // tap, never automatic, because the location column is the only thing
    // that separates fifty John Smiths. The server clears a rating whenever
    // its name changes, so skipping or dismissing needs no cleanup here.
    function renderFargoBadge(p, fargo) {
        const el = document.getElementById(p + '-fargo-badge');
        el.hidden = fargo == null;
        el.innerText = fargo == null ? '' : `· Fargo ${fargo}`;
    }
    function fargoNote(panel, text) {
        panel.innerHTML = '';
        const note = document.createElement('button');
        note.className = 'ghost note';
        note.textContent = text;
        note.onclick = () => { panel.hidden = true; };
        panel.appendChild(note);
        panel.hidden = false;
    }
    function fargoRow(p, panel, pl) {
        const btn = document.createElement('button');
        btn.onclick = () => pickFargo(p, panel, pl.rating);
        const who = document.createElement('span');
        who.className = 'who';
        who.textContent = pl.name + ' ';
        const loc = document.createElement('span');
        loc.className = 'loc';
        loc.textContent = pl.location;
        who.appendChild(loc);
        const rating = document.createElement('span');
        rating.className = 'rating';
        rating.textContent = String(pl.rating);
        if (!pl.established) {
            rating.append(' ');
            const prov = document.createElement('span');
            prov.className = 'prov';
            prov.textContent = 'prov';
            rating.appendChild(prov);
        }
        btn.append(who, rating);
        return btn;
    }
    async function nameChanged(p) {
        await postConfig();
        fargoSearch(p);
    }
    async function fargoSearch(p) {
        const name = document.getElementById(p + '-name').value.trim();
        const panel = document.getElementById(p + '-fargo-results');
        if (!name) { panel.hidden = true; return; }
        fargoNote(panel, 'Searching Fargo…');
        let res = null;
        try {
            res = await fetch('/api/fargo/search?q=' + encodeURIComponent(name)).then(x => x.json());
        } catch (e) {}
        // The operator may have retyped while we waited — stale results lie.
        if (document.getElementById(p + '-name').value.trim() !== name) return;
        if (!res || !res.ok) { fargoNote(panel, 'Fargo unreachable — tap to dismiss'); return; }
        if (!res.players.length) { fargoNote(panel, 'No Fargo match — tap to dismiss'); return; }
        panel.innerHTML = '';
        // 20 is plenty to scroll on a phone; past that the fix is a fuller name.
        for (const pl of res.players.slice(0, 20)) panel.appendChild(fargoRow(p, panel, pl));
        const skip = document.createElement('button');
        skip.className = 'ghost note';
        skip.textContent = res.players.length > 20
            ? `${res.players.length} matches — refine the name, or skip the rating`
            : 'Not them / no rating — skip';
        skip.onclick = () => { panel.hidden = true; };
        panel.appendChild(skip);
        panel.hidden = false;
    }
    async function pickFargo(p, panel, rating) {
        panel.hidden = true;
        await fetch('/api/score/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ [p + '_fargo']: rating }),
        });
    }
    async function postConfig(race) {
        await fetch('/api/score/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                p1_name: document.getElementById('p1-name').value,
                p2_name: document.getElementById('p2-name').value,
                race_to: race === undefined ? raceTo : race,
            }),
        });
    }
    function stepRace(delta) {
        // Stepping up from cleared lands on 5, not 1: nobody plays a race to
        // one, and 5 is the shortest real one — 7 and 9 are then a tap away.
        const next = raceTo == null ? (delta > 0 ? 5 : null) : Math.max(1, raceTo + delta);
        if (next === raceTo) return;
        postConfig(next);
    }
    function clearRace() { postConfig(null); }
    async function resetScores() {
        if (confirm('Reset scores to 0–0?')) await post('/api/score/reset');
    }

    // ---- Clock ----
    const ALARM_STATES = ['GRACE', 'EXPIRED'];
    function render(s) {
        const t = s.display ?? s.time ?? null;
        document.getElementById('time').innerText = t ?? '–';
        document.getElementById('time').classList.toggle(
            'urgent', (s.time ?? 99) <= 5 && s.state !== 'IDLE');
        const pill = document.getElementById('state');
        pill.innerText = s.state;
        pill.classList.toggle('live', s.state === 'RUNNING');
        pill.classList.toggle('alarm', ALARM_STATES.includes(s.state));
        document.getElementById('extensions').innerText =
            `Extensions ${s.extensions_used} of ${s.extensions_allowed}`;
        // Same trick as the deck's START key: name the countdown the press
        // will hand you, straight off the server's rack-aware `base`.
        if (typeof s.base === 'number') {
            document.getElementById('start-n').innerText = `Start ${s.base}`;
        }
        // re-sync the dropdowns if either axis changed elsewhere (the deck)
        for (const [id, active] of [['ruleset', s.ruleset], ['mode', s.mode]]) {
            const sel = document.getElementById(id);
            if (active && sel.value !== active) {
                for (const o of sel.options) if (o.value === active) o.selected = true;
            }
        }
        if (typeof s.vision === 'boolean') renderVision(s.vision);
        if (s.score) renderScore(s.score);
    }

    function setConnected(live) {
        document.getElementById('conn').classList.toggle('live', live);
        document.getElementById('conn-text').innerText = live ? 'Connected' : 'Reconnecting';
    }
    function connect() {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        const ws = new WebSocket(`${proto}://${location.host}/ws`);
        ws.onopen = () => setConnected(true);
        ws.onmessage = (ev) => { try { render(JSON.parse(ev.data)); } catch (e) {} };
        ws.onclose = () => { setConnected(false); setTimeout(connect, 500); };
    }
    loadRulesets();
    connect();
</script>
</body>
</html>
