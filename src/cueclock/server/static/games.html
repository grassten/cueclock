<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>cueclock — games</title>
    <style>
        /* The minigames HUD (#46), 1920x1080, filling its own Games scene.

           ONE source, TWO postures:

             menu    opaque, while the picker is up — cards in deck order, each
                     tagged with the key that picks it. The screen is the
                     brochure, the deck is the picker, and there is nothing to
                     point at or navigate.
             game    chrome only — a bottom bar over a transparent canvas, so
                     the overhead feed behind it fills the wall.

           The split of labour is load-bearing: everything ON THE CLOTH (grid,
           ghosts, zones, miss line, lag bracket) is drawn server-side into the
           Syphon feed by `display/pipeline.py`, which owns the mm→display
           mapping. This page draws NOTHING positional — it never has to align
           itself with the table image, so a recalibration can't break it.

           The bar is the live scene's plinth wearing games content, so the wall
           keeps one voice: name + context left, stat lockups centre, and the
           answer cell on the right where the clock lives during a match.

           Checkpoint 92/96 rule: **correct in a source that has never
           painted.** No entrance animations, nothing that depends on having
           been visible, and the picker — the resting state — is fetched over
           HTTP as well as broadcast, so a cold cut shows real numbers. */
        :root {
            color-scheme: dark;
            --ink: #0B0E13;
            --accent: #2E86C8;
            --slate: #9FB3C4;
            --alarm: #FF4D4D;
            --panel: #111721;
            --line: rgba(159, 179, 196, 0.18);
            --hair: rgba(159, 179, 196, 0.11);
            --dim: #6C7A87;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; overflow: hidden; }
        body {
            /* Transparent by default: in the game posture the overhead feed is
               the picture and this page is only the bar. The menu posture
               paints its own ground (`#stage.menu` below). */
            background: transparent;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Authored at 1920x1080 and scaled to the source, exactly like the bar
           and the bracket page: text rasterizes at the wall's own resolution
           instead of being upscaled by OBS. */
        #stage {
            position: absolute;
            top: 0; left: 0;
            width: 1920px; height: 1080px;
            transform-origin: top left;
        }
        #stage.menu { background: var(--ink); }

        /* ---------------- the menu ---------------- */
        #menu { position: absolute; inset: 0; }
        #stage.playing #menu { display: none; }

        .ghdr {
            position: absolute; top: 0; left: 0; right: 0; height: 76px;
            display: flex; align-items: center; padding: 0 40px; gap: 28px;
            border-bottom: 1px solid var(--hair);
        }
        .ghdr .title {
            font-size: 26px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
        }
        .ghdr .right {
            margin-left: auto; font-size: 15px; letter-spacing: 2px; color: var(--slate);
            font-weight: 700; text-transform: uppercase;
        }
        .cards {
            position: absolute; top: 76px; left: 0; right: 0; bottom: 0;
            display: flex; align-items: center; justify-content: center; gap: 60px;
        }
        .gcard {
            width: 560px; height: 400px; background: var(--panel); border: 1px solid var(--line);
            border-radius: 10px; padding: 36px 40px; position: relative;
        }
        .gcard .keytag {
            position: absolute; top: 36px; right: 40px; font-size: 13px; letter-spacing: 2px;
            color: var(--dim); font-weight: 700; border: 1px solid var(--hair);
            border-radius: 5px; padding: 5px 10px; text-transform: uppercase;
        }
        .gcard h3 {
            margin: 0 0 14px; font-size: 34px; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase;
        }
        .gcard .desc { font-size: 19px; color: var(--slate); line-height: 1.5; min-height: 88px; }
        .gcard .stats { display: flex; gap: 52px; margin-top: 34px; }
        .gcard .st .l { font-size: 13px; letter-spacing: 2.5px; color: var(--dim); font-weight: 700; }
        .gcard .st .v {
            font-size: 38px; font-weight: 700; margin-top: 8px; font-variant-numeric: tabular-nums;
        }
        .gcard .st .v .unit { font-size: 20px; color: var(--slate); }
        .gcard .last {
            position: absolute; left: 40px; bottom: 30px; font-size: 14px; letter-spacing: 2px;
            color: var(--dim); font-weight: 700; text-transform: uppercase;
        }

        /* ---------------- the bar ---------------- */
        #bar {
            position: absolute; left: 0; right: 0; bottom: 0; height: 160px;
            background: var(--ink); font-variant-numeric: tabular-nums;
        }
        #stage.menu #bar { display: none; }
        /* The drain above the plinth, so the bar never cuts the cloth with a
           hard line — the same gradient the live scene's bar carries. */
        #bar::before {
            content: ''; position: absolute; left: 0; right: 0; bottom: 100%; height: 30px;
            background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.41));
        }
        .who { position: absolute; left: 40px; top: 52px; }
        .who .nm {
            font-size: 28px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
        }
        .who .ctx {
            font-size: 14px; font-weight: 700; letter-spacing: 2.5px; color: var(--slate);
            text-transform: uppercase; margin-top: 10px;
        }
        /* The lockups sit in the space between the name block and the answer
           cell's divider, centred — so one stat, two or three all land
           balanced without any of them being positioned by hand. */
        .gstats {
            position: absolute; left: 520px; right: 330px; top: 0; bottom: 0;
            display: flex; align-items: center; justify-content: center; gap: 96px;
        }
        .gstat { text-align: center; }
        .gstat .l {
            font-size: 15px; font-weight: 700; letter-spacing: 4px; color: var(--slate);
            white-space: nowrap;
        }
        .gstat .v {
            font-size: 46px; font-weight: 700; line-height: 1; white-space: nowrap;
            margin-top: 16px;
        }
        .gstat .v.ok { color: var(--slate); }
        .gstat .v.wide { font-size: 30px; }
        .gstat .v .unit { font-size: 24px; color: var(--slate); margin-left: 4px; }
        .gstat .s {
            font-size: 13px; font-weight: 700; letter-spacing: 2.5px; color: var(--dim);
            white-space: nowrap; margin-top: 14px;
        }
        .gdiv {
            position: absolute; right: 290px; top: 34px; width: 1px; height: 92px;
            background: rgba(255, 255, 255, 0.2);
        }
        /* The answer cell escalates BY AREA — the rule every overlay obeys.
           Games mode has no clock, so a FAIL cannot collide with an expiry. */
        .vcell { position: absolute; right: 0; top: 0; bottom: 0; width: 290px; }
        .vcell .word {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            font-size: 56px; font-weight: 700; letter-spacing: 3px; white-space: nowrap;
        }
        .vcell .word.small { font-size: 40px; color: var(--slate); }
        .vcell .word .unit { font-size: 28px; color: rgba(255, 255, 255, 0.7); margin-left: 4px; }
        .vcell .eyebrow {
            position: absolute; left: 50%; top: 32px; transform: translate(-50%, -50%);
            font-size: 14px; font-weight: 700; letter-spacing: 3px; color: var(--slate);
        }
        .vcell.pass { background: rgba(46, 134, 200, 0.96); }
        .vcell.fail { background: rgba(255, 77, 77, 0.96); }
        .vcell.pass .eyebrow, .vcell.fail .eyebrow { color: rgba(255, 255, 255, 0.75); }
        .vcell.pass .word.small, .vcell.fail .word.small { color: #fff; }
    </style>
</head>
<body>
<div id="stage" class="menu">
    <div id="menu">
        <div class="ghdr">
            <div class="title">Games</div>
            <div class="right">Pick on the deck</div>
        </div>
        <div class="cards" id="cards"></div>
    </div>
    <div id="bar">
        <div class="who"><div class="nm" id="bar-name"></div><div class="ctx" id="bar-ctx"></div></div>
        <div class="gstats" id="bar-stats"></div>
        <div class="gdiv"></div>
        <div class="vcell" id="bar-answer"></div>
    </div>
</div>

<script>
    const stage = document.getElementById('stage');
    function fitStage() {
        const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', fitStage);
    fitStage();

    // The picker is this source's resting state, so it is fetched over HTTP as
    // well as broadcast: a Games scene cut to cold has real numbers on it
    // before the first WS frame arrives, which is what "correct in a source
    // that has never painted" means for a page whose menu IS the default.
    let picker = [];

    function esc(text) {
        return String(text == null ? '' : text).replace(/[&<>"]/g, (c) => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
        ));
    }

    function unit(u) {
        return u ? `<span class="unit">${esc(u)}</span>` : '';
    }

    function renderCards() {
        document.getElementById('cards').innerHTML = picker.map((game) => `
            <div class="gcard">
                <div class="keytag">Key ${esc(game.key)}</div>
                <h3>${esc(game.title)}</h3>
                <div class="desc">${esc(game.description)}</div>
                <div class="stats">
                    ${(game.stats || []).map((s) => `
                        <div class="st">
                            <div class="l">${esc(s.label)}</div>
                            <div class="v">${esc(s.value)}${unit(s.unit)}</div>
                        </div>`).join('')}
                </div>
                <div class="last">${game.last_played
                    ? 'Last played · ' + esc(game.last_played) : 'Never played'}</div>
            </div>`).join('');
    }

    function renderBar(hud) {
        document.getElementById('bar-name').textContent = hud.name || '';
        document.getElementById('bar-ctx').textContent = hud.context || '';
        // A value with a space in it is a phrase, not a number ("CUE IN ZONE",
        // "PLACE THE CUE BALL") — it gets the smaller size so the lockup keeps
        // its shape instead of running into its neighbour.
        document.getElementById('bar-stats').innerHTML = (hud.stats || []).map((s) => {
            const cls = (s.ok ? ' ok' : '') + (String(s.value).indexOf(' ') >= 0 ? ' wide' : '');
            return `<div class="gstat">
                <div class="l">${esc(s.label)}</div>
                <div class="v${cls}">${esc(s.value)}${unit(s.unit)}</div>
                ${s.sub ? `<div class="s">${esc(s.sub)}</div>` : ''}
            </div>`;
        }).join('');
        const cell = document.getElementById('bar-answer');
        const answer = hud.answer;
        cell.className = 'vcell' + (answer && answer.fill ? ' ' + answer.fill : '');
        cell.innerHTML = !answer ? '' : `
            ${answer.eyebrow ? `<div class="eyebrow">${esc(answer.eyebrow)}</div>` : ''}
            <div class="word${answer.small ? ' small' : ''}">
                ${esc(answer.word)}${unit(answer.unit)}
            </div>`;
    }

    function onState(state) {
        const games = state.games;
        // `null` means the session is not in games mode at all. The Games scene
        // should not be up, but if it is, the menu is the honest thing to show
        // — never a stale bar for a game nobody is playing.
        if (games && games.picker && games.picker.length) {
            picker = games.picker;
            renderCards();
        }
        const playing = !!(games && games.active && games.hud);
        stage.className = playing ? 'playing' : 'menu';
        if (playing) renderBar(games.hud);
    }

    async function loadPicker() {
        try {
            const data = await (await fetch('/api/games')).json();
            if (data.picker && data.picker.length) { picker = data.picker; renderCards(); }
        } catch (e) { /* server down: the menu chrome still renders, empty */ }
    }

    function connect() {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        const ws = new WebSocket(`${proto}://${location.host}/ws`);
        ws.onmessage = (ev) => { try { onState(JSON.parse(ev.data)); } catch (e) {} };
        ws.onclose = () => setTimeout(connect, 500);
        ws.onerror = () => ws.close();
    }
    loadPicker();
    connect();
</script>
</body>
</html>
