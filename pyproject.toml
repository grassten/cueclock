[project]
name = "cueclock"
version = "0.1.0"
description = "Automated pool shot clock driven by an overhead machine-vision camera"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Steven Asten" }]
dependencies = [
    "androidtvremote2>=0.3.1",
    "fastapi>=0.140.6",
    "httpx>=0.28.1",
    "numpy",
    "opencv-python",
    "pillow>=12.3.0",
    "pypylon",
    "sounddevice>=0.5.5",
    "streamdeck>=0.9.8",
    "syphon-python>=0.1.1; sys_platform == 'darwin'",
    "uvicorn>=0.51.0",
    "vosk==0.3.44",  # newest release with a macOS universal2 wheel (0.3.45 is Linux/Windows only)
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-xdist>=3.8.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cueclock"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]  # prose + illustrative snippets, not maintained code

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pypylon.*", "syphon.*", "Foundation", "objc", "StreamDeck.*", "vosk", "sounddevice"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Full tracebacks and a summary of every non-passing test, always. A cold
# corpus battery is ~5 minutes and its golden diffs ARE the measurement, so a
# short traceback that hides one is a 5-minute tax to re-read something already
# computed. `-ra` lists every failure at the end, where a truncated log keeps it.
addopts = ["-ra", "--tb=long"]
# Import from src/ directly: this Mac's pyenv-based venvs don't process .pth
# files, so uv's editable install of the package is never importable. See
# CHANGELOG.md (2026-07-27).
pythonpath = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]
