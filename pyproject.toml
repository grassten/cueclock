[project]
name = "cueclock"
version = "0.1.0"
description = "Automated pool shot clock driven by an overhead machine-vision camera"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Steven Asten" }]
dependencies = [
    "fastapi>=0.140.6",
    "numpy",
    "opencv-python",
    "pypylon",
    "syphon-python>=0.1.1; sys_platform == 'darwin'",
    "uvicorn>=0.51.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cueclock"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]  # prose + illustrative snippets, not maintained code

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pypylon.*", "syphon.*", "Foundation", "objc"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from src/ directly: this Mac's pyenv-based venvs don't process .pth
# files, so uv's editable install of the package is never importable. See
# docs/progress.md (2026-07-27).
pythonpath = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]
